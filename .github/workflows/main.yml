name: Build APK

on:
  push:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Unpack
        run: unzip -o tesseract-android.zip

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Read version from the project
        id: ver
        run: |
          V=$(grep -oP 'versionName\s*=\s*"\K[^"]+' tesseract/app/build.gradle.kts)
          echo "version=$V" >> $GITHUB_OUTPUT
          echo "tag=v$V-b${{ github.run_number }}" >> $GITHUB_OUTPUT

      - name: Build
        working-directory: tesseract
        env:
          BUILD_NUMBER: ${{ github.run_number }}
        run: gradle assembleDebug --no-daemon

      - name: Name the APK after its version
        run: |
          cp tesseract/app/build/outputs/apk/debug/app-debug.apk \
             tesseract-${{ steps.ver.outputs.version }}-b${{ github.run_number }}.apk

      - uses: actions/upload-artifact@v4
        with:
          name: tesseract-apk
          path: tesseract-${{ steps.ver.outputs.version }}-b${{ github.run_number }}.apk

      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          NOTES="tesseract/RELEASE_NOTES.md"
          if [ ! -f "$NOTES" ]; then echo "Build ${{ github.run_number }}." > "$NOTES"; fi
          gh release create "${{ steps.ver.outputs.tag }}" \
            tesseract-${{ steps.ver.outputs.version }}-b${{ github.run_number }}.apk \
            --title "Tesseract ${{ steps.ver.outputs.version }} · build ${{ github.run_number }}" \
            --notes-file "$NOTES"
